syntax = "proto3";

package esogem;
option go_package = "github.com/fis/esolangs/esogem/server/proto";

message Config {
  string server_addr = 1;
  ModelConfig model = 2;
  WikiConfig wiki = 3;
  string log_file = 4;
}

message ModelConfig {
  string tokenizer_spm = 1;
  string ollama_url = 2;
  string model_name = 3;
  int64 context_size = 4;
}

message WikiConfig {
  string url = 1;
  string namespaces = 2;
  string cache_file = 3;
}
