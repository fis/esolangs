edition = "2024";

package esologs;

message Config {
  string listen_port = 1;
  repeated TargetConfig target = 2;
  string pipe_socket = 3;
  string metrics_addr = 4;
  VerifierConfig verifier = 5;
}

message TargetConfig {
  string name = 1;
  string log_path = 2;
  string nick = 3;
  string title = 4;
  string about = 5;
  string announce = 6;
}

message VerifierConfig {
  string cookie = 1;
  string secret = 2;
  string domain = 3;
  string form = 4;
  string success = 5;
  string css = 6;
}
